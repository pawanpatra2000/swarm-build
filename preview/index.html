<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>swarm-build</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600;700&display=swap">
<!-- Same Tailwind runtime as the generated page, so the preview renders sections exactly as the output does. -->
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/swarm.css">
</head>
<body>
<header id="topbar">
  <div class="brand"><span class="logo" aria-hidden="true"></span>swarm-build</div>
  <div id="brief" class="brief" title=""></div>
  <div class="chips">
    <span id="model" class="chip"></span>
    <span id="phase" class="chip phase">connecting</span>
    <span id="timer" class="chip mono">0.0s</span>
    <div class="speed" role="group" aria-label="Animation speed">
      <button type="button" data-speed="1">1×</button>
      <button type="button" data-speed="2">2×</button>
      <button type="button" data-speed="3">3×</button>
    </div>
    <button type="button" id="replay-top" class="ghost">Replay</button>
  </div>
</header>

<main id="main">
  <section id="canvas" aria-label="Live build preview">
    <div id="frame">
      <div class="frame-bar"><i></i><i></i><i></i><span id="frame-url">preview</span></div>
      <div id="frame-body"><div id="stage"></div></div>
    </div>
  </section>
  <aside id="panel">
    <h2>Agents</h2>
    <ul id="agents"></ul>
    <h2>Log</h2>
    <ol id="log"></ol>
  </aside>
</main>

<div id="overlay" aria-hidden="true"></div>

<div id="finale" hidden>
  <div class="card">
    <div class="kicker">Build complete</div>
    <div class="big"><span id="f-wall">0s</span></div>
    <div class="sub" id="f-line"></div>
    <dl class="grid">
      <div><dt>Agents in parallel</dt><dd id="f-agents"></dd></div>
      <div><dt>One agent, one after another</dt><dd id="f-seq"></dd></div>
      <div><dt>Speed-up</dt><dd id="f-speed"></dd></div>
      <div><dt>Model cost</dt><dd id="f-cost"></dd></div>
    </dl>
    <div class="actions">
      <button type="button" id="go-live" class="primary">Go live</button>
      <button type="button" id="replay" class="ghost">Replay</button>
      <a id="open-page" class="ghost" href="#" target="_blank" rel="noopener">Open page</a>
    </div>
  </div>
</div>

<div id="error" hidden></div>
<script src="/swarm.js"></script>
</body>
</html>
