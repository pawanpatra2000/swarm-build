name: Release

# Publishes to npm when a version tag is pushed:
#   npm version patch   (or minor / major)
#   git push --follow-tags
#
# Uses npm trusted publishing (OIDC): no npm token is stored anywhere. Configure once on npmjs.com:
#   package swarm-build -> Settings -> Trusted publishing -> GitHub Actions,
#   owner pawanpatra2000, repository swarm-build, workflow release.yml.
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the GitHub release
  id-token: write   # OIDC token for npm trusted publishing (also signs provenance)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm with trusted publishing support
        run: npm install -g npm@latest
      - name: Tag matches package.json
        run: |
          v="$(node -p 'require("./package.json").version')"
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then echo "Tag $GITHUB_REF_NAME does not match package.json version $v"; exit 1; fi
      - name: Syntax check
        run: for f in bin/*.mjs src/*.mjs preview/swarm.js; do node --check "$f"; done
      - name: Smoke tests
        run: npm test
      - name: Publish to npm
        run: |
          v="$(node -p 'require("./package.json").version')"
          if npm view "swarm-build@$v" version >/dev/null 2>&1; then echo "swarm-build@$v is already on npm, skipping publish"; exit 0; fi
          npm publish --access public
      - name: GitHub release
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
